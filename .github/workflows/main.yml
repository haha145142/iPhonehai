name: GCamStyle iOS Cloud Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Validate Xcode project
        run: |
          test -f GCamStyle.xcodeproj/project.pbxproj
          test -f GCamStyle.xcodeproj/xcshareddata/xcschemes/GCamStyle.xcscheme
          test -f GCamStyle/GCamStyle.swift
          test -f GCamStyle/Info.plist

      - name: Archive iOS app
        run: |
          xcodebuild \
            -project GCamStyle.xcodeproj \
            -scheme GCamStyle \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GCamStyle.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package IPA
        run: |
          rm -rf Payload GCamStyle-iOS-unsigned.ipa
          mkdir Payload
          cp -R "$RUNNER_TEMP/GCamStyle.xcarchive/Products/Applications/GCamStyle.app" Payload/
          /usr/bin/zip -qry GCamStyle-iOS-unsigned.ipa Payload
          ls -lh GCamStyle-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GCamStyle-iOS-unsigned-IPA
          path: GCamStyle-iOS-unsigned.ipa
          if-no-files-found: error
