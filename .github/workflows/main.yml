name: GCamStyle iOS Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build GCamStyle IPA
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks | grep -E 'iphoneos' | tail -5 || true

      - name: Validate project
        run: |
          test -f GCamStyle.xcodeproj/project.pbxproj
          test -f GCamStyle.xcodeproj/xcshareddata/xcschemes/GCamStyle.xcscheme
          test -f GCamStyle/GCamStyle.swift
          test -f GCamStyle/Info.plist
          xcodebuild -project GCamStyle.xcodeproj -list

      - name: Build for iPhone
        run: |
          rm -rf "$RUNNER_TEMP/GCamDerivedData"
          xcodebuild \
            -project GCamStyle.xcodeproj \
            -scheme GCamStyle \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/GCamDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign for resigning tools
        run: |
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          test -d "$APP"
          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"
          test -d "$APP/_CodeSignature"

      - name: Verify Mach-O
        run: |
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          test -f "$APP/GCamStyle"
          file "$APP/GCamStyle"
          /usr/bin/lipo -info "$APP/GCamStyle" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          rm -rf Payload GCamStyle-iOS-resignable.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry GCamStyle-iOS-resignable.ipa Payload
          ls -lh GCamStyle-iOS-resignable.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GCamStyle-iOS-resignable-IPA
          path: GCamStyle-iOS-resignable.ipa
          if-no-files-found: error
