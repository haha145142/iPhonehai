name: GCamStyle iOS Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build resignable GCamStyle IPA
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks | grep -E 'iphoneos|iPhoneOS' | tail -10 || true

      - name: Validate Xcode project
        run: |
          set -euxo pipefail
          test -f GCamStyle.xcodeproj/project.pbxproj
          test -f GCamStyle.xcodeproj/xcshareddata/xcschemes/GCamStyle.xcscheme
          test -f GCamStyle/GCamStyle.swift
          test -f GCamStyle/Info.plist
          xcodebuild -project GCamStyle.xcodeproj -list

      - name: Build device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/GCamDerivedData" "$RUNNER_TEMP/xcodebuild.log"
          xcodebuild \
            -project GCamStyle.xcodeproj \
            -scheme GCamStyle \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/GCamDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify app bundle
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          test -d "$APP"
          test -f "$APP/GCamStyle"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          test "$EXECUTABLE" = "GCamStyle"
          test -f "$APP/$EXECUTABLE"
          test "$IDENTIFIER" = "com.gcamstyle.ios"
          file "$APP/GCamStyle"
          /usr/bin/otool -hv "$APP/GCamStyle" | head -8

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          rm -rf Payload GCamStyle-iOS-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry GCamStyle-iOS-unsigned.ipa Payload
          /usr/bin/unzip -tq GCamStyle-iOS-unsigned.ipa

      - name: Create temporary ad-hoc signature
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          EXE="$APP/GCamStyle"

          /usr/bin/codesign --remove-signature "$APP" || true
          /usr/bin/codesign --remove-signature "$EXE" || true

          # Sign the main executable first, then the app bundle. This produces
          # a valid temporary ad-hoc signature that resigning tools can replace.
          /usr/bin/codesign --force --verbose --timestamp=none --sign - "$EXE"
          /usr/bin/codesign --force --verbose --timestamp=none --sign - "$APP"

          /usr/bin/codesign --display --verbose=4 "$APP"
          /usr/bin/codesign --verify --strict --verbose=4 "$APP"

      - name: Package resignable IPA
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          rm -rf Payload GCamStyle-iOS-resignable.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry GCamStyle-iOS-resignable.ipa Payload
          /usr/bin/unzip -tq GCamStyle-iOS-resignable.ipa
          ls -lh GCamStyle-iOS-resignable.ipa

      - name: iOS 27 simulator startup smoke test
        run: |
          set -euxo pipefail

          SIM_RUNTIME_ID=$(/usr/bin/xcrun simctl list runtimes -j | /usr/bin/python3 -c '
import json,sys
r=json.load(sys.stdin)["runtimes"]
x=[x["identifier"] for x in r if x["platform"]=="iOS" and x["version"].startswith("27.0") and x["isAvailable"]]
print(x[0] if x else "")
')
          test -n "$SIM_RUNTIME_ID"

          DEVICE_TYPE_ID=$(/usr/bin/xcrun simctl list devicetypes -j | /usr/bin/python3 -c '
import json,sys
d=json.load(sys.stdin)["devicetypes"]
x=[x["identifier"] for x in d if x["name"]=="iPhone 17 Pro"]
print(x[0] if x else "")
')
          test -n "$DEVICE_TYPE_ID"

          UDID=$(/usr/bin/xcrun simctl create GCamStyle-Smoke "$DEVICE_TYPE_ID" "$SIM_RUNTIME_ID")
          trap '/usr/bin/xcrun simctl shutdown "$UDID" || true; /usr/bin/xcrun simctl delete "$UDID" || true' EXIT

          /usr/bin/xcrun simctl boot "$UDID"
          /usr/bin/xcrun simctl bootstatus "$UDID" -b

          rm -rf "$RUNNER_TEMP/GCamSimulator"
          xcodebuild \
            -project GCamStyle.xcodeproj \
            -scheme GCamStyle \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/GCamSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_SIM="$RUNNER_TEMP/GCamSimulator/Build/Products/Debug-iphonesimulator/GCamStyle.app"
          test -d "$APP_SIM"
          test -f "$APP_SIM/GCamStyle"
          /usr/bin/xcrun simctl install "$UDID" "$APP_SIM"
          /usr/bin/xcrun simctl launch "$UDID" com.gcamstyle.ios
          sleep 5

          LOG=$(/usr/bin/xcrun simctl spawn "$UDID" log show --last 5s --style compact --predicate 'process == "GCamStyle"' || true)
          echo "$LOG"
          ! echo "$LOG" | grep -Eiq 'fatal error|uncaught exception|SIGABRT|EXC_CRASH|abort\(\)'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GCamStyle-build-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app/Info.plist
          if-no-files-found: ignore

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: GCamStyle-iOS-unsigned-IPA
          path: GCamStyle-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Upload resignable IPA
        uses: actions/upload-artifact@v7
        with:
          name: GCamStyle-iOS-resignable-IPA
          path: GCamStyle-iOS-resignable.ipa
          if-no-files-found: error
