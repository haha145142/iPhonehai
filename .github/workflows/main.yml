name: GCamStyle iOS Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build resignable GCamStyle IPA
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks | grep -E 'iphoneos|iPhoneOS' | tail -10 || true

      - name: Validate Xcode project
        run: |
          set -euxo pipefail
          test -f GCamStyle.xcodeproj/project.pbxproj
          test -f GCamStyle.xcodeproj/xcshareddata/xcschemes/GCamStyle.xcscheme
          test -f GCamStyle/GCamStyle.swift
          test -f GCamStyle/Info.plist
          xcodebuild -project GCamStyle.xcodeproj -list

      - name: Build device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/GCamDerivedData" "$RUNNER_TEMP/xcodebuild.log"
          xcodebuild \
            -project GCamStyle.xcodeproj \
            -scheme GCamStyle \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/GCamDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify app bundle
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          test -d "$APP"
          test -f "$APP/GCamStyle"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          file "$APP/GCamStyle"
          /usr/bin/otool -hv "$APP/GCamStyle" | head -8

      - name: Create temporary ad-hoc signature
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          /usr/bin/codesign --remove-signature "$APP" || true
          /usr/bin/codesign --force --verbose --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package resignable IPA
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app"
          rm -rf Payload GCamStyle-iOS-resignable.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry GCamStyle-iOS-resignable.ipa Payload
          /usr/bin/unzip -tq GCamStyle-iOS-resignable.ipa
          ls -lh GCamStyle-iOS-resignable.ipa

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GCamStyle-build-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/GCamDerivedData/Build/Products/Release-iphoneos/GCamStyle.app/Info.plist
          if-no-files-found: ignore

      - name: Upload resignable IPA
        uses: actions/upload-artifact@v4
        with:
          name: GCamStyle-iOS-resignable-IPA
          path: GCamStyle-iOS-resignable.ipa
          if-no-files-found: error
