name: Build iPhonehai IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate project
        run: |
          set -euxo pipefail
          xcodebuild -list -project iPhonehai.xcodeproj
          test -f iPhonehai/iPhonehai/Config/AgcConfig.swift
          test -f iPhonehai/iPhonehai/Processing/PhotoProcessor.swift

      - name: Build device archive
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild archive \
            -project iPhonehai.xcodeproj \
            -scheme iPhonehai \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iPhonehai.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build.log

      - name: Verify app
        run: |
          set -euxo pipefail
          APP="build/iPhonehai.xcarchive/Products/Applications/iPhonehai.app"
          test -d "$APP"
          test -f "$APP/iPhonehai"
          file "$APP/iPhonehai"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "build/iPhonehai.xcarchive/Products/Applications/iPhonehai.app" build/Payload/
          cd build
          zip -qry iPhonehai-unsigned.ipa Payload
          unzip -tq iPhonehai-unsigned.ipa
          ls -lh iPhonehai-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhonehai-unsigned-ipa
          path: build/iPhonehai-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhonehai-build-log
          path: build.log
          if-no-files-found: ignore
