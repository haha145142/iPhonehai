name: Build GCamStyle iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild \
            -project GCamStyle.xcodeproj \
            -scheme GCamStyle \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GCamStyle.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          rm -rf Payload GCamStyle-iOS-unsigned.ipa
          mkdir Payload
          cp -R "$RUNNER_TEMP/GCamStyle.xcarchive/Products/Applications/GCamStyle.app" Payload/
          zip -qry GCamStyle-iOS-unsigned.ipa Payload
          ls -lh GCamStyle-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GCamStyle-iOS-IPA
          path: GCamStyle-iOS-unsigned.ipa
          if-no-files-found: error
