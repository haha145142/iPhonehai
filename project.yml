name: iPhonehai
options:
  bundleIdPrefix: com.haha145142
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "27.0"
targets:
  iPhonehai:
    type: application
    platform: iOS
    sources:
      - path: iPhonehai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haha145142.iphonehai
        PRODUCT_NAME: iPhonehai
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄照片和提供相机预览"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于将照片保存到相册"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
